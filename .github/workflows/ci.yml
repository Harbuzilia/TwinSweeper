name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # windows-latest: the app is Windows-only (os.startfile, mbcs, ctypes
    # kernel32 hardlinks) and the suite exercises those paths.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Tests (pytest)
        run: python -m pytest tests/ -q

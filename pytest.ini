[pytest]
# E2E-спек web-режима (tests/e2e) исключён из дефолтного прогона: ему нужны
# браузер Playwright (chromium) и живой Flet web-сервер. Это ручной/локальный
# регрессионный гейт, CI его не запускает.
#   дефолт:   pytest tests/ -q          -> юнит-тесты, e2e deselected
#   вручную:  pytest tests/e2e -m e2e   -> e2e-гейт (CLI -m перекрывает addopts)
markers =
    e2e: end-to-end UI-тест против запущенного Flet web-сервера (ручной гейт)
addopts = -m "not e2e"

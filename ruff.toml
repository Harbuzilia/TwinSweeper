# Минимальный конфиг под текущий стиль проекта.
# Отбираются только реальные ошибки (E/W/F: pycodestyle + pyflakes) —
# без массовых автопереписываний аннотаций/импортов (UP, I и т.п.),
# чтобы правки оставались точечными и безопасными.
target-version = "py312"

line-length = 260  # длинные цепочки flet-контролов — сознательный стиль

[lint]
select = ["E", "W", "F"]

[lint.per-file-ignores]
"tests/*" = ["F401"]  # тесты импортируют модуль целиком для monkeypatch
